<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnects servem o @import do Intel One Mono no index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>OPP — Observatório de Políticas Públicas</title>
    <!--
      Tema antes do primeiro paint. Precisa ser inline e síncrono: qualquer
      atraso mostra o tema errado por um frame. Espelha a resolução do
      useTheme.ts — chave ausente significa "automático".
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
